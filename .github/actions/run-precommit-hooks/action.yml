name: 'Run precommit hooks'

runs:
  using: "composite"
  steps:
    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4.3'

    - name: Set up renv and restore lockfile
      uses: r-lib/actions/setup-renv@v2
      with:
        cache-version: 1

    - name: Install dos2unix
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y dos2unix

    - name: run precommit hooks
      shell: bash
      run: |
        R CMD INSTALL .
        Rscript -e 'captain::install_precommit(force=TRUE)'
        Rscript -e 'status <- captain::run_precommit(); status <- if (is.null(status)) 1L else as.integer(status); quit(save = "no", status = status, runLast = FALSE)'
